<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Relay Messenger</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #06b6d4; /* Electric Cyan */
            --secondary: #d946ef; /* Neon Magenta */
            --text: #f1f5f9;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .box { 
            background: var(--card); 
            padding: 30px; 
            border-radius: 20px; 
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(6, 182, 212, 0.2);
            border: 1px solid #334155;
            transition: transform 0.3s ease;
        }

        h2 { color: var(--primary); margin-top: 0; }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 5px var(--primary); }

        button { 
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .hidden { display: none; }
        
        code {
            display: block;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            color: var(--secondary);
            word-break: break-all;
            margin: 15px 0;
        }

        .status-badge {
            background: rgba(6, 182, 212, 0.1);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

    <div id="setup" class="box">
        <h2>Enter System</h2>
        <p style="color: #94a3b8;">Choose a unique Identifier</p>
        <input type="text" id="myUsername" placeholder="e.g., Jovi_Admin">
        <button onclick="startSession()">Initialize ID</button>
    </div>

    <div id="main" class="box hidden">
        <div style="margin-bottom: 20px;">
            <span class="status-badge">Active: <span id="displayUser"></span></span>
        </div>
        
        <p style="font-size: 0.85rem; color: #94a3b8;">Share your communication link:</p>
        <code id="shareLink"></code>
        
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        
        <form id="msgForm" action="https://formspree.io/f/xbdpapoq" method="POST">
            <input type="hidden" name="Sender_ID" id="formSender">
            
            <label style="font-size: 0.8rem; display: block; text-align: left;">RECIPIENT ID</label>
            <input type="text" name="Recipient_ID" placeholder="Who are you messaging?" required>
            
            <label style="font-size: 0.8rem; display: block; text-align: left; margin-top:10px;">ENCRYPTED MESSAGE</label>
            <textarea name="Message" placeholder="Type your message..." style="height:100px;" required></textarea>
            
            <button type="submit">Transmit Data</button>
        </form>
    </div>

    <script>
        function startSession() {
            const user = document.getElementById('myUsername').value;
            if(!user) return alert("Please enter an ID to continue.");
            
            document.getElementById('displayUser').innerText = user;
            document.getElementById('formSender').value = user;
            
            // Generates a clean link for others to find you
            const currentURL = window.location.href.split('?')[0];
            document.getElementById('shareLink').innerText = currentURL + "?target=" + user;
            
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');
        }
    </script>
</body>
</html>
